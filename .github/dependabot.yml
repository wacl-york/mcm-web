version: 2
registries:
  gemfury:
    type: rubygems-server
    url: https://gem.fury.io/universityofyork
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "07:00"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "07:00"
